bundle:
  name: mlops-dev-bundle

targets:
  dev:
    workspace:
      host: https://dbc-d7513240-903a.cloud.databricks.com

resources:
  jobs:
    mlops_dev_pipeline:
      name: mlops-dev-pipeline

      tasks:
        - task_key: data_ingestion
          notebook_task:
            notebook_path: notebooks/00_data_ingestion.py
            base_parameters:
              env: dev
          compute: serverless

        - task_key: data_validation
          depends_on:
            - task_key: data_ingestion
          notebook_task:
            notebook_path: notebooks/01_data_validation.py
            base_parameters:
              env: dev
          compute: serverless

        - task_key: feature_engineering
          depends_on:
            - task_key: data_validation
          notebook_task:
            notebook_path: notebooks/02_feature_engineering.py
            base_parameters:
              env: dev
          compute: serverless

        - task_key: train_model
          depends_on:
            - task_key: feature_engineering
          notebook_task:
            notebook_path: notebooks/03_train_model.py
            base_parameters:
              env: dev
              experiment_name: /Shared/mlops_dev
              feature_pipeline: /Workspace/Users/krathour13@gmail.com/dbfs_data/feature_pipeline.joblib
          compute: serverless
